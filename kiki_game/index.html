<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>קיקי מחפש את היוצא דופן</title><style>
:root{font-family:Arial,'Noto Sans Hebrew',sans-serif;color:#17325e}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#a9e9ff 0%,#e3f9ff 48%,#d9f5b0 100%);min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.pill,.btn{background:white;border:3px solid #3b91d8;border-radius:20px;padding:10px 18px;font-size:19px;font-weight:800;box-shadow:0 5px 0 #c4e4f6}.btn{cursor:pointer;color:#123d78}.btn:disabled{opacity:.45;cursor:not-allowed}.title{margin:18px auto 8px;max-width:780px;background:#ffdf91;border:5px solid #c87b35;border-radius:24px;text-align:center;padding:13px;font-size:clamp(25px,4vw,42px);font-weight:900;color:#164680}.sub{text-align:center;font-size:clamp(19px,2.7vw,27px);font-weight:800;margin:16px}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:22px 0}.item{position:relative;background:linear-gradient(145deg,#fff,#f0faff);border:5px solid #2c8fd3;border-radius:25px;min-height:242px;padding:15px 6px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:0 8px 0 #b7d7ec;transition:transform .15s,border-color .15s}.item:hover{transform:translateY(-4px)}.item:focus-visible{outline:5px solid orange}.item.wrong{border-color:#e76b5b;animation:shake .3s}.item.correct{border-color:#3aaf61;background:#effff0}.picture{width:min(100%,205px);height:168px;object-fit:contain;display:block;filter:drop-shadow(0 4px 3px #0001)}.oldpicture{font-family:'Apple Color Emoji','Segoe UI Emoji',sans-serif;font-size:clamp(64px,9vw,110px);line-height:1.3;filter:drop-shadow(0 5px 2px #0002)}.item .name{font-size:clamp(17px,2vw,23px);font-weight:800}.mark{position:absolute;top:6px;left:12px;font-size:35px}.feedback{min-height:58px;text-align:center;font-size:24px;font-weight:800}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px}.primary{background:#7452db;border-color:#5733af;color:white}.progress{height:13px;background:#d5e7ef;border-radius:30px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:#35b96d;transition:width .2s}.hint{font-size:15px;text-align:center;color:#436080}.select{border-radius:12px;border:2px solid #398ac4;padding:9px;background:white;font-size:18px}.kiki{font-size:45px;vertical-align:middle}footer{text-align:center;font-size:13px;padding:14px;color:#506779}@keyframes shake{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}@media(max-width:650px){.board{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.item{min-height:174px}.picture{height:115px;width:100%}.wrap{padding:10px}}
</style></head><body><main class="wrap"><header class="top"><span class="pill">🦔 קיקי והמשימות</span><span class="pill" id="counter"></span><label>מעבר לשלב: <select class="select" id="jump" aria-label="בחירת שלב"></select></label></header><div class="progress"><div id="progress"></div></div><h1 class="title">קיקי מחפש את היוצא דופן 🔎</h1><p class="sub" id="prompt">מה יוצא דופן?</p><section class="board" id="board" aria-label="ארבע אפשרויות"></section><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn" id="restart">↻ התחלה מחדש</button><button class="btn" id="retry">↺ נסו שוב</button><button class="btn primary" id="next" disabled>לשלב הבא ←</button></div><p class="hint">לאחר בחירה נכונה אפשר לתרגל בעל פה את ההסבר. המעבר לשלב הבא נעשה בלחיצה בלבד.</p></main><footer>המשחק פועל גם במחשב וגם בטאבלט • 18 שלבים • איורים שמורים בתוך המשחק • ללא צורך בחיבור לאינטרנט</footer><script>
const x=(name,icon)=>({name,icon});
const levels=[
{type:'היכרות חזותית',cat:'עיגולים אדומים',items:[x('עיגול אדום','🔴'),x('עיגול אדום','🔴'),x('עיגול אדום','🔴'),x('משולש צהוב','🔺')],odd:3, special:true},
{type:'היכרות חזותית',cat:'גלגלים',items:[x('גלגל','🛞'),x('גלגל','🛞'),x('גלגל','🛞'),x('נעל','👟')],odd:3},
{type:'היכרות חזותית',cat:'בננות',items:[x('בננה','🍌'),x('נחש','🐍'),x('בננה','🍌'),x('בננה','🍌')],odd:1},
{type:'מיון לפי קטגוריה',cat:'מאכלים',items:[x('פסטה','🍝'),x('כריך','🥪'),x('צ׳יפס','🍟'),x('כיסא','🪑')],odd:3},
{type:'מיון לפי קטגוריה',cat:'בעלי חיים',items:[x('דג','🐟'),x('חתול','🐈'),x('מכנסיים','👖'),x('ג׳ירפה','🦒')],odd:2},
{type:'מיון לפי קטגוריה',cat:'כלי תחבורה',items:[x('כבאית','🚒'),x('כובע','🧢'),x('אוטו','🚗'),x('מטוס','✈️')],odd:1},
{type:'מיון לפי קטגוריה',cat:'בגדים',items:[x('עגבנייה','🍅'),x('כפפות','🧤'),x('מעיל','🧥'),x('חולצה','👕')],odd:0},
{type:'מיון לפי קטגוריה',cat:'צעצועים ומשחקים',items:[x('כדור','⚽'),x('חבל קפיצה','🪢'),x('מגנטים למשחק','🧲'),x('מיטה','🛏️')],odd:3},
{type:'מיון לפי קטגוריה',cat:'פירות',items:[x('תפוח','🍎'),x('בננה','🍌'),x('ענבים','🍇'),x('נעל','👟')],odd:3},
{type:'מיון לפי קטגוריה',cat:'רהיטים',items:[x('מיטה','🛏️'),x('שולחן','🪑'),x('ספה','🛋️'),x('פרפר','🦋')],odd:3},
{type:'מיון לפי קטגוריה',cat:'כלי תחבורה',items:[x('אוטובוס','🚌'),x('רכבת','🚆'),x('אופניים','🚲'),x('עוגה','🎂')],odd:3},
{type:'מיון לפי קטגוריה',cat:'פריטים שלובשים על כפות הרגליים',items:[x('נעליים','👟'),x('גרביים','🧦'),x('סנדלים','🩴'),x('אבטיח','🍉')],odd:3},
{type:'מיון לפי קטגוריה',cat:'בעלי חיים',items:[x('כלב','🐕'),x('אריה','🦁'),x('פיל','🐘'),x('מברשת שיניים','🪥')],odd:3},
{type:'מיון לפי קטגוריה',cat:'כלי אוכל',items:[x('מזלג','🍴'),x('כף','🥄'),x('סכין','🔪'),x('מטוס','✈️')],odd:3},
{type:'מיון לפי קטגוריה',cat:'ירקות',items:[x('גזר','🥕'),x('מלפפון','🥒'),x('פלפל','🫑'),x('כובע','🧢')],odd:3},
{type:'מיון לפי קטגוריה',cat:'בגדים',items:[x('חולצה','👕'),x('מכנסיים','👖'),x('שמלה','👗'),x('כדור','⚽')],odd:3},
{type:'מיון לפי קטגוריה',cat:'צעצועים',items:[x('בובה','🧸'),x('מכונית צעצוע','🚙'),x('קוביות משחק','🧱'),x('בננה','🍌')],odd:3},
{type:'מיון לפי קטגוריה',cat:'רכבי חירום',items:[x('כבאית','🚒'),x('אמבולנס','🚑'),x('ניידת משטרה','🚓'),x('כריך','🥪')],odd:3}
];
const pictureKeys=[["red-circle", "red-circle", "red-circle", "yellow-triangle"], ["wheel", "wheel", "wheel", "shoe"], ["banana", "snake", "banana", "banana"], ["pasta", "sandwich", "fries", "chair"], ["fish", "cat", "pants", "giraffe"], ["firetruck", "cap", "car", "plane"], ["tomato", "gloves", "coat", "shirt"], ["ball", "jump-rope", "magnets", "bed"], ["apple", "banana", "grapes", "shoe"], ["bed", "table", "sofa", "butterfly"], ["bus", "train", "bike", "cake"], ["shoe", "socks", "sandals", "watermelon"], ["dog", "lion", "elephant", "toothbrush"], ["fork", "spoon", "knife", "plane"], ["carrot", "cucumber", "pepper", "cap"], ["shirt", "pants", "dress", "ball"], ["doll", "toycar", "blocks", "banana"], ["firetruck", "ambulance", "police", "sandwich"]];let current=0,done=false,attempts=0;const $=id=>document.getElementById(id);
function shuffle(a){let b=a.map((v,i)=>({...v,source:i}));for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
let shown=[];function render(){done=false;attempts=0;shown=shuffle(levels[current].items);$('counter').textContent=`שלב ${current+1} מתוך ${levels.length}`;$('jump').value=current;$('progress').style.width=`${(current/levels.length)*100}%`;$('prompt').textContent=current<3?'איזה פריט שונה מהאחרים?':'איזה פריט לא שייך לקבוצה?';$('board').innerHTML='';$('feedback').textContent='';$('next').disabled=true;$('next').textContent=current===levels.length-1?'סיום המשחק 🎉':'לשלב הבא ←';shown.forEach((item,index)=>{const b=document.createElement('button');b.className='item';b.setAttribute('aria-label',item.name);let pic=document.createElement('img');pic.className='picture';pic.src='assets/'+pictureKeys[current][item.source]+'.webp';pic.alt=item.name;pic.loading='eager';pic.onerror=()=>{pic.style.display='none';label.textContent=item.name};pic.draggable=false;const label=document.createElement('span');label.className='name';label.textContent=item.name;b.append(pic,label);b.onclick=()=>choose(index,b);$('board').append(b)})}
function choose(index,button){if(done)return;const item=shown[index];if(item.source===levels[current].odd){done=true;button.classList.add('correct');button.insertAdjacentHTML('afterbegin','<span class="mark">⭐</span>');$('feedback').textContent='כל הכבוד! מצאת את היוצא דופן! 🌟';$('next').disabled=false;document.querySelectorAll('.item').forEach(b=>b.disabled=true)}else{attempts++;button.classList.add('wrong');$('feedback').textContent='ננסה שוב! מה שונה מהאחרים?';setTimeout(()=>button.classList.remove('wrong'),500)}}
$('next').onclick=()=>{if(!done)return;if(current===levels.length-1){$('feedback').textContent='כל הכבוד! סיימתם את כל המשימות! 🦔🎉';$('next').disabled=true;return}current++;render()};$('restart').onclick=()=>{current=0;render()};$('retry').onclick=render;$('jump').innerHTML=levels.map((l,i)=>`<option value="${i}">שלב ${i+1} – ${l.type}</option>`).join('');$('jump').onchange=e=>{current=Number(e.target.value);render()};render();
</script></body></html>
